name: Reproducibility checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: r-lib/actions/setup-r@v2
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: |
          python -m py_compile \
            'P01 - Lifetime Risk of SUI & POP Surgery/02 Code/P01_wu_analysis.py' \
            'P02 - Obliterative vs Reconstructive POP Surgery/02 Code/P02_analysis.py' \
            'P03 - Sling vs Urethral Bulking Temporal Trends/02 Code/P03_analysis.py' \
            '04 Logs/build_publication_packages.py'
      - name: R syntax
        run: |
          Rscript -e "files <- c('P01 - Lifetime Risk of SUI & POP Surgery/02 Code/P01_wu_export.R', 'P02 - Obliterative vs Reconstructive POP Surgery/02 Code/P02_server_analysis.R', 'P02 - Obliterative vs Reconstructive POP Surgery/02 Code/P02_P03_disclosure_export.R', 'P03 - Sling vs Urethral Bulking Temporal Trends/02 Code/P03_server_analysis.R', '04 Logs/P01_P03_server_method_audit_2026-09-04.R'); invisible(lapply(files, parse))"
      - name: Project contracts and release safety
        run: python -m unittest discover -s tests -v
